<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<meta name="theme-color" content="#fafaf8">
<meta name="color-scheme" content="light dark">
$seo
<meta property="og:type" content="website">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:url" content="$url">
<meta property="og:locale" content="$locale">
<meta property="og:image" content="$origin/assets/images/site/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="$title">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/images/site/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/images/site/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script src="/assets/js/theme-init.js"></script>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/site.css">
<script src="/assets/js/main.js" defer></script>
<script type="application/ld+json">$schema</script>
</head>
<body>
<a class="skip-link" href="#main">$skip</a>
$header
<main id="main" tabindex="-1">$body</main>
$footer
</body>
</html>
